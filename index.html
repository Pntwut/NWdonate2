<style>
  :root{
    --bg:#0d0917; --card:#160f22; --card-edge:#2c1f42;
    --ink:#f6efe4; --muted:#9d93b8;
    --gold:#f3b93a; --pink:#ff3d77; --cyan:#2fe6d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(60% 50% at 10% 0%, rgba(255,61,119,.12), transparent 60%),
      radial-gradient(50% 40% at 100% 10%, rgba(47,230,214,.10), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:'Sarabun',sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 80px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card);
    border:1px solid var(--card-edge); border-radius:22px;
    padding:28px 26px; position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:22px; right:22px; height:2px;
    background:linear-gradient(90deg, var(--pink), var(--gold), var(--cyan));
  }
  h1{ font-family:'Kanit',sans-serif; font-weight:800; font-size:24px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 22px; }

  label{ display:block; font-size:13px; color:var(--muted); margin:16px 0 6px; }
  input, textarea{
    width:100%; background:#0f0a1a; border:1px solid var(--card-edge); border-radius:12px;
    color:var(--ink); font-family:'Sarabun',sans-serif; font-size:15px; padding:12px 14px;
    outline:none;
  }
  input:focus, textarea:focus{ border-color:var(--gold); }
  textarea{ resize:vertical; min-height:70px; }
  .amounts{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .amounts button{
    flex:1; min-width:70px; padding:10px; border-radius:10px; border:1px solid var(--card-edge);
    background:transparent; color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:700;
    cursor:pointer; transition:.15s;
  }
  .amounts button.active, .amounts button:hover{ border-color:var(--gold); color:var(--gold); background:rgba(243,185,58,.08); }

  .primary{
    width:100%; margin-top:22px; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--pink), #ff7aa8); color:#fff;
    font-family:'Kanit',sans-serif; font-weight:700; font-size:16px; cursor:pointer;
  }
  .primary:disabled{ opacity:.5; cursor:not-allowed; }

  #qrStep{ display:none; text-align:center; }
  #qrStep img{ width:220px; height:220px; border-radius:14px; background:#fff; padding:10px; margin:10px auto; }
  .amount-tag{
    font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold); font-size:22px;
  }
  .upload-box{
    margin-top:18px; border:1.5px dashed var(--card-edge); border-radius:14px; padding:18px;
    text-align:center; cursor:pointer; color:var(--muted); font-size:13px;
  }
  .upload-box.has-file{ border-color:var(--cyan); color:var(--cyan); }
  .status{ margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  .status.ok{ color:#3ecf6e; }
  .status.err{ color:#ff6767; }
  .back{ background:none; border:none; color:var(--muted); font-size:13px; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>
<div class="card">

  <div id="formStep">
    <h1 id="pageHeading">💌 โดเนทให้กำลังใจ</h1>
    <p class="sub">พิมพ์ข้อความ แล้วข้อความจะขึ้นจอไลฟ์ทันทีที่ระบบตรวจสลิปผ่าน</p>

    <label>ชื่อของคุณ</label>
    <input id="name" maxlength="30" placeholder="เช่น น้องแป้ง">

    <label>ข้อความให้กำลังใจ</label>
    <textarea id="message" maxlength="120" placeholder="สู้ๆนะครับ!"></textarea>

    <label>จำนวนเงิน (บาท)</label>
    <input id="amount" type="number" min="1" placeholder="กรอกจำนวนเอง">
    <div class="amounts">
      <button type="button" data-v="20">20</button>
      <button type="button" data-v="50">50</button>
      <button type="button" data-v="100">100</button>
      <button type="button" data-v="200">200</button>
    </div>

    <button class="primary" id="toQr">สร้าง QR สำหรับโอนเงิน</button>
  </div>

  <div id="qrStep">
    <h1>สแกนเพื่อโอนเงิน</h1>
    <p class="amount-tag" id="amountShow"></p>
    <img id="qrImg" alt="PromptPay QR">
    <p class="sub">โอนแล้วแนบภาพสลิปด้านล่าง ระบบจะตรวจสอบอัตโนมัติ</p>

    <label style="text-align:left">แนบสลิปโอนเงิน</label>
    <div class="upload-box" id="uploadBox">📎 แตะเพื่อเลือกภาพสลิป</div>
    <input type="file" id="slipFile" accept="image/*" style="display:none">

    <button class="primary" id="submitSlip" disabled>ส่งสลิปตรวจสอบ</button>
    <div class="status" id="statusMsg"></div>
    <button class="back" id="backBtn">← กลับไปแก้ไขข้อมูล</button>
  </div>

</div>

<script>
/* ============================================================

/* ============================================================
   UI Logic
   ============================================================ */
const formStep = document.getElementById('formStep');
const qrStep = document.getElementById('qrStep');
let currentDonation = null;
let slipDataUrl = null;

document.querySelectorAll('.amounts button').forEach(btn => {
  btn.onclick = () => {
    document.getElementById('amount').value = btn.dataset.v;
    document.querySelectorAll('.amounts button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

document.getElementById('toQr').onclick = async () => {
  const name = document.getElementById('name').value.trim();
  const message = document.getElementById('message').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);

  if (!name || !message) return alert('กรอกชื่อและข้อความให้ครบก่อนนะครับ');
  if (!amount || amount < CONFIG.minAmount) return alert('กรอกจำนวนเงินให้ถูกต้อง');

  currentDonation = { name, message, amount };

  try {
    if (typeof QRCode === 'undefined') {
      throw new Error('ไฟล์ index.html อาจถูกก็อปมาไม่ครบ (โค้ดสร้าง QR ฝังอยู่ในไฟล์แล้ว ไม่ได้พึ่ง CDN ภายนอกแล้ว) ลองก็อปไฟล์ทั้งหมดวางใหม่อีกครั้ง');
    }
    const payload = window.generatePromptPayPayload(CONFIG.promptpayId, { amount });
    const canvas = document.createElement('canvas');
    await QRCode.toCanvas(canvas, payload, { width: 220, margin: 1 });
    document.getElementById('qrImg').src = canvas.toDataURL();
  } catch (err) {
    console.error('สร้าง QR ไม่สำเร็จ:', err);
    alert('สร้าง QR ไม่สำเร็จ: ' + err.message);
    return;
  }

  document.getElementById('amountShow').textContent = amount.toLocaleString() + ' บาท';
  formStep.style.display = 'none';
  qrStep.style.display = 'block';
};

document.getElementById('backBtn').onclick = () => {
  qrStep.style.display = 'none';
  formStep.style.display = 'block';
};

const uploadBox = document.getElementById('uploadBox');
const slipFile = document.getElementById('slipFile');
uploadBox.onclick = () => slipFile.click();
slipFile.onchange = () => {
  const file = slipFile.files[0];
  if (!file) return;
  uploadBox.textContent = '✅ ' + file.name;
  uploadBox.classList.add('has-file');
  document.getElementById('submitSlip').disabled = false;
  const reader = new FileReader();
  reader.onload = e => { slipDataUrl = e.target.result; };
  reader.readAsDataURL(file);
};

document.getElementById('submitSlip').onclick = async () => {
  const statusMsg = document.getElementById('statusMsg');
  const btn = document.getElementById('submitSlip');
  btn.disabled = true;
  statusMsg.className = 'status';
  statusMsg.textContent = 'กำลังตรวจสอบสลิป…';

  try {
    const res = await fetch(CONFIG.cloudFunctionUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...currentDonation, slipImage: slipDataUrl }),
    });
    const data = await res.json();

    if (data.success) {
      statusMsg.className = 'status ok';
      statusMsg.textContent = '🎉 ขอบคุณครับ! ข้อความกำลังขึ้นจอ';
      document.getElementById('submitSlip').style.display = 'none';
    } else {
      statusMsg.className = 'status err';
      statusMsg.textContent = '❌ ' + (data.message || 'ตรวจสอบสลิปไม่ผ่าน ลองใหม่อีกครั้ง');
      btn.disabled = false;
    }
  } catch (e) {
    statusMsg.className = 'status err';
    statusMsg.textContent = '❌ ส่งไม่สำเร็จ เช็คอินเทอร์เน็ตแล้วลองใหม่';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
